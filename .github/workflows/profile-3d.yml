name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 18 * * *"   # daily, ~midnight IST
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # To count PRIVATE repo contributions too, create a classic PAT
          # (scopes: repo, read:user), save it as repo secret GH_PAT,
          # and swap the line below for: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib/
          git commit -m "chore: regenerate 3D contribution graph" || echo "No changes"
          git push
